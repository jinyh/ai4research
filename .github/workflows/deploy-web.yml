name: deploy-web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Sync dependencies
        working-directory: web
        run: uv sync --frozen
      - name: Link content
        working-directory: web
        run: uv run python scripts/link_content.py
      - name: Build site
        working-directory: web
        run: uv run mkdocs build --strict
      - name: Verify student site
        working-directory: web
        run: |
          uv run python -m unittest discover -s tests -v
          uv run python scripts/check_site.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/_build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
