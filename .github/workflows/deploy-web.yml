name: deploy-web

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed student-only snapshot
        uses: actions/checkout@v4
        with:
          # Snapshot on codex/student-site; update only after publication checks.
          ref: b2465696d4621eef2c3fd79668f7cdceda28676c
          path: student-site
          persist-credentials: false
      - name: Verify publication boundary
        shell: bash
        run: |
          test -f student-site/index.html
          test -f student-site/search/search_index.json
          for lesson in $(seq -w 1 16); do
            test -f "student-site/learn/$lesson/index.html"
          done
          if find student-site -type l -print -quit | grep -q .; then
            echo 'Unexpected symlink in student site' >&2
            exit 1
          fi
          if find student-site -type f \( -name '*.pptx' -o -name 'teaching-plan.md' -o -name 'teacher-review-ledger.md' -o -name 'application-form-draft.md' \) -print -quit | grep -q .; then
            echo 'Internal material in student site' >&2
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: student-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
