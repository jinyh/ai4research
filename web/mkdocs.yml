site_name: 智能科研方法
site_description: "上海交通大学研究生课程“智能科研方法”（AI for Research: Methods and Practice）"
site_url: https://jinyh.github.io/ai4research/

docs_dir: docs
site_dir: _build

theme:
  name: material
  language: zh
  font: false  # G6：禁用 Google Fonts（大陆可达性差），回退系统字体
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  # 2.0 v1.3.0 移除深色模式（网站恒浅色）：删 slate palette 与切换按钮，
  # 免除 16 课嵌图双背景验收；搜索分词维持 lang: [ja] 现状，不增依赖
  palette:
    scheme: default
    primary: custom
    accent: custom

extra_css:
  - stylesheets/course.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search:
      lang:
        - ja  # Material 中文搜索的常用近似配置；必要时改用 jieba
  - tags

hooks:
  - scripts/build_downloads.py  # 从发布清单生成可独立运行的课堂下载包
  - scripts/hide_metadata.py  # 剥离正文里的版本/最后更新/变更记录，不展示在网页
  - scripts/student_view.py  # 权威条件引用、课堂入口、草稿发布保护
  - scripts/strip_dead_links.py  # 私有资料显式标记；学生资源缺失使构建失败

nav:
  - 首页: index.md
  - 16 讲课程:
      - learn/index.md
      - 01 · AI 辅助科研导论: learn/01.md
      - 02 · 科研伦理与 Agent 边界: learn/02.md
      - 03 · 检索与来源核验: learn/03.md
      - 04 · 精读与主张核验: learn/04.md
      - 05 · 证据地图: learn/05.md
      - 06 · 问题定义: learn/06.md
      - 07 · 假设与区分实验: learn/07.md
      - 08 · 中期诊所: learn/08.md
      - 09 · Baseline 与复现: learn/09.md
      - 10 · 受限 Agent 执行: learn/10.md
      - 11 · 自动化循环: learn/11.md
      - 12 · 个人工作流: learn/12.md
      - 13 · 工作流评价: learn/13.md
      - 14 · 结果写成论证: learn/14.md
      - 15 · 同行评审与修改: learn/15.md
      - 16 · 最终展示: learn/16.md
  - 项目与考核: project.md
  - 模板与资源:
      - templates.md
      - 阅读卡回放包: materials/reading-card.md
      - 课前准备: course/pi-setup.md
      - 沐曦算力支持: course/metax-compute.md
      - 阅读清单: course/reading-list.md
      - 工具与学习资源: course/resources.md
  - 课程信息: teacher.md
